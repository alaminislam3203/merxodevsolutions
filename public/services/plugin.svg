<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Gradients & Filters -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#091e42" flood-opacity="0.18" />
    </filter>
    <linearGradient id="monitor-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <feStop offset="0%" stop-color="#4f46e5" />
      <feStop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="puzzle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <feStop offset="0%" stop-color="#8b5cf6" />
      <feStop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="hook-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <feStop offset="0%" stop-color="#06b6d4" />
      <feStop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="package-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <feStop offset="0%" stop-color="#f59e0b" />
      <feStop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="turbo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <feStop offset="0%" stop-color="#ec4899" />
      <feStop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <feStop offset="0%" stop-color="#10b981" />
      <feStop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="card-inner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <feStop offset="0%" stop-color="#f8fafc" />
      <feStop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Clean White Background -->
  <rect width="1024" height="1024" fill="#ffffff" />

  <!-- Outer Orbit Dashed Circles -->
  <circle cx="512" cy="512" r="390" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="8 8" />
  <circle cx="512" cy="512" r="340" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Decorative Orbit Dots & Mini Accents -->
  <circle cx="360" cy="150" r="5" fill="#f59e0b" />
  <circle cx="680" cy="160" r="4" fill="#06b6d4" />
  <circle cx="890" cy="400" r="6" fill="#ec4899" />
  <circle cx="150" cy="620" r="5" fill="#8b5cf6" />
  <circle cx="780" cy="800" r="4" fill="#10b981" />
  
  <!-- Mini Floating Gears -->
  <g transform="translate(690, 140) scale(0.6)" fill="#8b5cf6" opacity="0.85">
    <path d="M26 18a8 8 0 100 16 8 8 0 000-16zm18 9c0-.7-.1-1.4-.2-2l4.4-3.4-4-6.9-5.2 2.1c-1.1-.9-2.4-1.6-3.8-2.1L34 0h-8l-1.2 5.7c-1.4.5-2.7 1.2-3.8 2.1L15.8 5.7l-4 6.9 4.4 3.4c-.1.6-.2 1.3-.2 2s.1 1.4.2 2l-4.4 3.4 4 6.9 5.2-2.1c1.1.9 2.4 1.6 3.8 2.1L26 36h8l1.2-5.7c1.4-.5 2.7-1.2 3.8-2.1l5.2 2.1 4-6.9-4.4-3.4c.1-.6.2-1.3.2-2z"/>
  </g>
  <g transform="translate(190, 560) scale(0.55)" fill="#06b6d4" opacity="0.7">
    <path d="M26 18a8 8 0 100 16 8 8 0 000-16zm18 9c0-.7-.1-1.4-.2-2l4.4-3.4-4-6.9-5.2 2.1c-1.1-.9-2.4-1.6-3.8-2.1L34 0h-8l-1.2 5.7c-1.4.5-2.7 1.2-3.8 2.1L15.8 5.7l-4 6.9 4.4 3.4c-.1.6-.2 1.3-.2 2s.1 1.4.2 2l-4.4 3.4 4 6.9 5.2-2.1c1.1.9 2.4 1.6 3.8 2.1L26 36h8l1.2-5.7c1.4-.5 2.7-1.2 3.8-2.1l5.2 2.1 4-6.9-4.4-3.4c.1-.6.2-1.3.2-2z"/>
  </g>

  <!-- ── CENTER COMPUTER MONITOR ── -->
  <g filter="url(#soft-shadow)">
    <!-- Monitor Stand Base -->
    <path d="M430 680 L594 680 L560 620 L464 620 Z" fill="#312e81" />
    <ellipse cx="512" cy="685" rx="90" ry="14" fill="#1e1b4b" />

    <!-- Monitor Outer Body -->
    <rect x="320" y="370" width="384" height="250" rx="20" fill="url(#monitor-frame)" />
    <!-- Web Camera Dot -->
    <circle cx="512" cy="385" r="4.5" fill="#1e1b4b" />

    <!-- Monitor Inner Screen -->
    <rect x="338" y="400" width="348" height="204" rx="8" fill="#ffffff" />

    <!-- Screen Header Bar -->
    <rect x="338" y="400" width="348" height="28" rx="8" fill="#f1f5f9" />
    <circle cx="355" cy="414" r="4.5" fill="#ef4444" />
    <circle cx="370" cy="414" r="4.5" fill="#f59e0b" />
    <circle cx="385" cy="414" r="4.5" fill="#10b981" />
    
    <!-- Extension Marketplace Search bar -->
    <rect x="420" y="406" width="180" height="16" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="432" cy="414" r="3.5" fill="none" stroke="#6366f1" stroke-width="1.5" />
    <line x1="435" y1="417" x2="439" y2="421" stroke="#6366f1" stroke-width="1.5" />
    <text x="446" y="418" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#4338ca">Plugins &amp; Extensions</text>

    <!-- Plugin Item 1: Active Custom Plugin Card -->
    <g transform="translate(352, 440)">
      <rect x="0" y="0" width="320" height="46" rx="8" fill="url(#card-inner-grad)" stroke="#cbd5e1" stroke-width="1.2" />
      <!-- Plugin Icon Tile -->
      <rect x="8" y="8" width="30" height="30" rx="6" fill="#8b5cf6" />
      <path d="M19 14 h8 v8 a4 4 0 01-8 0 Z" fill="#ffffff" />
      <circle cx="23" cy="23" r="3" fill="#ffffff" />
      <!-- Text details -->
      <text x="46" y="22" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#1e293b">Merxo Commerce Hook v2.4</text>
      <text x="46" y="32" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">Custom checkout &amp; webhook bridge</text>
      <!-- Active Status Badge -->
      <rect x="230" y="14" width="46" height="18" rx="9" fill="#dcfce7" />
      <circle cx="239" cy="23" r="3" fill="#16a34a" />
      <text x="246" y="26" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#15803d">ACTIVE</text>
      <!-- Toggle Switch ON -->
      <rect x="284" y="16" width="26" height="14" rx="7" fill="#6366f1" />
      <circle cx="303" cy="23" r="5" fill="#ffffff" />
    </g>

    <!-- Plugin Item 2: Custom API Gateway Extension -->
    <g transform="translate(352, 494)">
      <rect x="0" y="0" width="320" height="46" rx="8" fill="url(#card-inner-grad)" stroke="#e2e8f0" stroke-width="1.2" />
      <!-- Plugin Icon Tile -->
      <rect x="8" y="8" width="30" height="30" rx="6" fill="#06b6d4" />
      <path d="M16 18 l7 5 l-7 5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="25" y1="28" x2="31" y2="28" stroke="#ffffff" stroke-width="2" />
      <!-- Text details -->
      <text x="46" y="22" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#1e293b">Smart Auth &amp; Role Gate</text>
      <text x="46" y="32" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">RBAC policy engine &amp; JWT filters</text>
      <!-- Active Status Badge -->
      <rect x="230" y="14" width="46" height="18" rx="9" fill="#dcfce7" />
      <circle cx="239" cy="23" r="3" fill="#16a34a" />
      <text x="246" y="26" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#15803d">ACTIVE</text>
      <!-- Toggle Switch ON -->
      <rect x="284" y="16" width="26" height="14" rx="7" fill="#06b6d4" />
      <circle cx="303" cy="23" r="5" fill="#ffffff" />
    </g>

    <!-- Plugin Item 3: Code Snippet / Hook Injector -->
    <g transform="translate(352, 548)">
      <rect x="0" y="0" width="320" height="44" rx="8" fill="#1e1b4b" />
      <circle cx="18" cy="14" r="3" fill="#ec4899" />
      <circle cx="28" cy="14" r="3" fill="#f59e0b" />
      <circle cx="38" cy="14" r="3" fill="#10b981" />
      <text x="54" y="17" font-family="monospace" font-size="7" font-weight="700" fill="#a5b4fc">hooks.register('merxo:lifecycle', (ctx) =&gt; ...)</text>
      <text x="18" y="33" font-family="monospace" font-size="8" fill="#38bdf8">&gt; Plugin compiled &amp; hot-reloaded [0ms]</text>
      <rect x="258" y="22" width="54" height="15" rx="4" fill="#6366f1" />
      <text x="285" y="33" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="800" fill="#ffffff">INSTALLED</text>
    </g>

    <!-- Mouse Pointer Arrow -->
    <g transform="translate(645, 470) scale(0.85)" filter="url(#soft-shadow)">
      <polygon points="0,0 24,14 14,16 20,28 14,30 8,18 0,22" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    </g>
  </g>

  <!-- ── ORBITING BADGES (7 Surrounding Circles) ── -->

  <!-- Top Badge: Jigsaw Puzzle Piece / Plugin (Indigo/Violet) -->
  <g transform="translate(512, 125)" filter="url(#badge-shadow)">
    <circle cx="0" cy="0" r="56" fill="url(#puzzle-grad)" />
    <!-- Modern Jigsaw Puzzle Piece -->
    <g transform="translate(-20, -20) scale(1)">
      <path d="M10 0 h12 a6 6 0 0112 0 h6 a4 4 0 014 4 v6 a6 6 0 010 12 v12 a4 4 0 01-4 4 h-12 a6 6 0 00-12 0 h-6 a4 4 0 01-4-4 v-12 a6 6 0 000-12 v-6 a4 4 0 014-4 z" fill="#ffffff" />
      <circle cx="20" cy="20" r="4" fill="#6366f1" />
    </g>
  </g>

  <!-- Top-Right Badge: API Hook & Connector Socket (Teal/Cyan) -->
  <g transform="translate(780, 240)" filter="url(#badge-shadow)">
    <circle cx="0" cy="0" r="54" fill="url(#hook-grad)" />
    <!-- Connector Plug Icon -->
    <g transform="translate(0, 0)">
      <rect x="-14" y="-8" width="28" height="20" rx="4" fill="#ffffff" />
      <line x1="-7" y1="-18" x2="-7" y2="-8" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <line x1="7" y1="-18" x2="7" y2="-8" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <path d="M0 12 v12" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <circle cx="0" cy="2" r="3" fill="#0891b2" />
    </g>
  </g>

  <!-- Right Badge: Modular Package / Box (Amber Gold) -->
  <g transform="translate(860, 520)" filter="url(#badge-shadow)">
    <circle cx="0" cy="0" r="52" fill="url(#package-grad)" />
    <!-- Package Box 3D -->
    <g transform="translate(0, -2)">
      <polygon points="0,-18 18,-8 0,2 -18,-8" fill="#fef3c7" />
      <polygon points="-18,-8 0,2 0,22 -18,12" fill="#fbbf24" />
      <polygon points="0,2 18,-8 18,12 0,22" fill="#d97706" />
      <line x1="0" y1="2" x2="0" y2="22" stroke="#78350f" stroke-width="1.5" />
    </g>
  </g>

  <!-- Bottom-Right Badge: Code Curly Brackets & Webhook (Dark Navy) -->
  <g transform="translate(740, 770)" filter="url(#badge-shadow)">
    <circle cx="0" cy="0" r="56" fill="#1e1b4b" />
    <path d="M0 -34 a34 34 0 100 68 a34 34 0 000-68" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-dasharray="14 6" />
    <!-- Code brackets { } -->
    <text x="0" y="10" text-anchor="middle" font-family="monospace" font-size="34" font-weight="900" fill="#ffffff">{ ; }</text>
  </g>

  <!-- Bottom Badge: Custom Settings Sliders & Filters (Blue/Indigo) -->
  <g transform="translate(512, 870)" filter="url(#badge-shadow)">
    <circle cx="0" cy="0" r="54" fill="#3b82f6" />
    <!-- Sliders Graphic -->
    <g transform="translate(-18, -18)">
      <line x1="4" y1="0" x2="4" y2="36" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" />
      <line x1="18" y1="0" x2="18" y2="36" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" />
      <line x1="32" y1="0" x2="32" y2="36" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" />
      <circle cx="4" cy="10" r="5" fill="#ffffff" />
      <circle cx="18" cy="24" r="5" fill="#ffffff" />
      <circle cx="32" cy="14" r="5" fill="#ffffff" />
    </g>
  </g>

  <!-- Bottom-Left Badge: Cloud Auto-Update / Sync (Emerald Green) -->
  <g transform="translate(260, 780)" filter="url(#badge-shadow)">
    <circle cx="0" cy="0" r="54" fill="url(#cloud-grad)" />
    <!-- Cloud with sync circular arrows -->
    <g transform="translate(0, 0)">
      <path d="M-14 4 a10 10 0 0119 -5 a8 8 0 0111 7 a5 5 0 01-5 5 h-22 a6 6 0 01-3 -7" fill="#ffffff" />
      <path d="M-4 6 l4 -4 l4 4" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="0" y1="-2" x2="0" y2="10" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Top-Left Badge: Turbo Speed & Light Weight (Rose/Coral Red) -->
  <g transform="translate(250, 240)" filter="url(#badge-shadow)">
    <circle cx="0" cy="0" r="54" fill="url(#turbo-grad)" />
    <!-- Lightning Bolt / Booster -->
    <polygon points="-4,-22 14,-22 2,-2 14,-2 -10,22 -4,4 -16,4" fill="#ffffff" />
  </g>
</svg>
